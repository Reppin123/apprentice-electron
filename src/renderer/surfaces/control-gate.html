<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Apprentice</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  /* Port of ControlGateWindow.swift — 460x300 hard-block panel (revocation,
     forced update, stale-offline). Deliberately spare: no retry, no close
     affordance. Driven by synthetic {type:"control_state"} host frames. */
  html,body{background:var(--ground);overflow:hidden;height:100%;}
  body{position:relative;}
  .dragstrip{position:absolute;left:0;top:0;right:0;height:30px;-webkit-app-region:drag;}
  .wrap{height:100%;display:flex;flex-direction:column;gap:14px;padding:22px;}

  .head{display:flex;align-items:center;gap:10px;}
  .glyph{display:flex;flex:0 0 auto;color:var(--tint,var(--red));}
  .brand{font-size:18px;font-weight:500;color:var(--ink);}

  .title{font-size:14px;font-weight:500;color:var(--ink);}
  .body{font-size:12px;font-weight:300;color:var(--dim);line-height:1.5;}
  .spacer{flex:1;}

  .actions{display:flex;justify-content:flex-end;-webkit-app-region:no-drag;}
  .btn{font-family:var(--font);font-size:13px;font-weight:500;border:0;cursor:pointer;
    padding:8px 16px;border-radius:7px;background:rgba(255,255,255,.10);color:var(--ink);}
  .btn:hover{background:rgba(255,255,255,.15);}
  .btn.primary{background:var(--indigo);color:#0A0B10;}
  .btn.primary:hover{background:#7C8BFF;}
</style>
</head>
<body>
  <div class="dragstrip"></div>
  <div class="wrap" id="wrap">
    <div class="head">
      <span class="glyph"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3 5 5.6v5.1c0 4.4 2.9 7.6 7 9.3 4.1-1.7 7-4.9 7-9.3V5.6Z"/></svg></span>
      <span class="brand">Apprentice</span>
    </div>
    <div class="title" id="title">Apprentice can't continue</div>
    <div class="body" id="body">An unexpected state. Please contact the owner.</div>
    <div class="spacer"></div>
    <div class="actions"><button class="btn" id="btn"></button></div>
  </div>
<script>
function sendMsg(o){const s=JSON.stringify(o);
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.agent)window.webkit.messageHandlers.agent.postMessage(s);
  else if(window.chrome&&window.chrome.webview)window.chrome.webview.postMessage(s);}

let action='quit';
function render(){
  const update=action==='update';
  document.getElementById('wrap').style.setProperty('--tint',update?'var(--indigo)':'var(--red)');
  const btn=document.getElementById('btn');
  btn.textContent=update?'Open Updater':'Quit';
  btn.classList.toggle('primary',update);
}
document.getElementById('btn').addEventListener('click',()=>{
  if(action==='update')sendMsg({type:'ui_action',action:'open_update'});
  else sendMsg({type:'host_quit'});});

const AGENT={};
AGENT['control_state']=function(m){
  if(m.title!=null)document.getElementById('title').textContent=m.title;
  if(m.body!=null)document.getElementById('body').textContent=m.body;
  if(m.action)action=m.action;
  render();};

window.__onWired=function(){};
window.__agentMsg=function(s){try{const m=JSON.parse(s);if(AGENT[m.type])AGENT[m.type](m);}catch(e){}};
render();
</script>
</body>
</html>
