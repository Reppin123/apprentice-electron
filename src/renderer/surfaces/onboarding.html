<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Apprentice Onboarding</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  /* Onboarding = 1:1 port of OnboardingPermissionsManager.swift's branded
     first-run panel: 1180×620, radius-22 card, 260px rail + 920px stage.
     The host owns permission polling + persistence; this page renders the
     step machine off perm_state / auth_state frames. */
  html,body{background:transparent;overflow:hidden;}
  .frame{display:flex;width:100vw;height:100vh;border-radius:22px;overflow:hidden;
    background:#050506;border:1px solid rgba(106,123,255,.13);-webkit-app-region:drag;}
  button{-webkit-app-region:no-drag;font-family:var(--font);}

  /* ---- left rail ---- */
  .rail{flex:0 0 260px;display:flex;flex-direction:column;padding:26px 18px 22px 22px;
    background:linear-gradient(180deg,#0A0A0E,#070709);border-right:1px solid rgba(255,255,255,.07);}
  .brandrow{display:flex;align-items:center;gap:10px;margin-bottom:32px;}
  .brandrow span{font-size:14px;color:var(--ink);}
  .bm{object-fit:cover;flex:0 0 auto;}
  .rnode{display:flex;gap:13px;align-items:flex-start;padding:9px 8px;border-radius:11px;}
  .rnode.active{background:rgba(106,123,255,.08);}
  .ncirc{width:27px;height:27px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;color:var(--faint);background:#08080b;border:1.5px solid rgba(255,255,255,.12);}
  .rnode.active .ncirc{background:rgba(106,123,255,.18);border-color:var(--indigo);color:#fff;}
  .rnode.done .ncirc{background:var(--teal);border-color:var(--teal);color:#050506;font-weight:700;}
  .nt{font-size:13.5px;color:var(--dim);padding-top:2px;}
  .rnode.active .nt{color:var(--ink);font-weight:500;}
  .ns{font-size:11px;font-weight:300;color:var(--faint);margin-top:2px;}
  .subs{display:flex;flex-direction:column;gap:1px;padding:2px 0 4px 42px;}
  .srow{display:flex;align-items:center;gap:8px;padding:4px 0;}
  .sdot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.12);flex:0 0 auto;}
  .srow.done .sdot{background:var(--teal);}
  .srow.cur .sdot{background:var(--indigo);}
  .sl{font-size:11.5px;font-weight:300;color:var(--faint);}
  .srow.done .sl{color:var(--dim);}
  .srow.cur .sl{color:var(--ink);}
  .railspace{flex:1;}
  .railfoot{font-size:10.5px;font-weight:300;color:var(--faint);line-height:1.6;
    padding-top:14px;border-top:1px solid rgba(255,255,255,.07);}

  /* ---- stage ---- */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;background:#050506;overflow:hidden;}
  .stagec{display:flex;justify-content:center;width:100%;padding:0 44px;
    transition:opacity .35s ease,filter .35s ease,transform .35s ease;}
  .stagec.recede{opacity:.32;filter:blur(2px);transform:scale(.975);}
  .phase{animation:phasein .45s ease both;}
  @keyframes phasein{from{opacity:0;}to{opacity:1;}}
  .center{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .col560{width:560px;display:flex;flex-direction:column;align-items:flex-start;}
  .settings{display:flex;gap:40px;align-items:center;max-width:820px;}
  .scol{display:flex;flex-direction:column;align-items:flex-start;min-width:0;}

  /* ---- shared type ---- */
  .pnum{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--faint);}
  .ptitle{font-size:34px;font-weight:100;letter-spacing:-.9px;line-height:1.2;color:var(--ink);margin-top:12px;}
  .ptitle b{font-weight:600;}
  .bigtitle{font-size:52px;letter-spacing:-1.8px;line-height:1.1;color:var(--ink);text-align:center;}
  .bigtitle .thin{font-weight:100;}
  .bigtitle b{font-weight:600;}
  .pbody{font-size:14px;font-weight:300;color:var(--dim);line-height:1.55;max-width:400px;margin-top:14px;}
  .pbody b,.note b,.gnote b,.sib b{font-weight:500;}
  .note{font-size:11.5px;font-weight:300;color:var(--faint);line-height:1.5;max-width:320px;margin-top:14px;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:300;color:var(--teal);
    padding:3px 10px;border-radius:999px;background:rgba(52,227,196,.08);border:1px solid rgba(52,227,196,.18);margin-top:13px;}
  .ck{width:15px;height:15px;border-radius:50%;background:var(--teal);color:#050506;font-size:9px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:500;letter-spacing:-.1px;
    color:#fff;background:var(--indigo);border:0;border-radius:999px;padding:13px 32px;cursor:pointer;}
  .btn.teal{background:var(--teal);color:#050506;}
  .btn:hover{filter:brightness(1.07);}
  .detect{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--teal);opacity:0;transition:opacity .3s ease;}
  .detect.show{opacity:1;}
  .revealbtn{display:flex;gap:11px;align-items:center;text-align:left;max-width:360px;margin-top:16px;padding:12px 15px;
    border-radius:12px;background:rgba(106,123,255,.10);border:1px solid rgba(106,123,255,.32);cursor:pointer;-webkit-app-region:no-drag;}
  .revealbtn svg{flex:0 0 auto;}
  .rt1{font-size:13.5px;font-weight:600;color:var(--ink);}
  .rt2{font-size:12px;font-weight:300;color:var(--dim);margin-top:2px;line-height:1.4;}

  /* welcome step dots */
  .wsteps{display:flex;gap:18px;margin-bottom:28px;}
  .ws{display:flex;flex-direction:column;align-items:center;gap:7px;}
  .wd{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.12);}
  .wl{font-size:11px;font-weight:300;color:var(--faint);}

  /* simulated System Settings pane */
  .smockcol{flex:0 0 340px;display:flex;flex-direction:column;align-items:center;}
  .sysmock{width:340px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.09);
    box-shadow:0 20px 30px rgba(0,0,0,.75);}
  .smtitle{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;background:#2C2C2E;}
  .tl{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .smt{flex:1;text-align:center;font-size:11px;color:#787878;}
  .smbody{display:flex;height:132px;background:#1C1C1E;}
  .smside{flex:0 0 150px;background:#232325;padding:10px 5px;}
  .smrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;background:rgba(106,123,255,.22);
    font-size:11.5px;color:#fff;}
  .smicon{width:18px;height:18px;border-radius:5px;flex:0 0 auto;background:linear-gradient(135deg,#4A8AF5,#2154CC);}
  .smmain{flex:1;padding:16px;min-width:0;}
  .smh{font-size:13px;font-weight:600;color:#fff;}
  .smapp{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:9px;background:rgba(255,255,255,.04);
    font-size:12.5px;color:#fff;}
  .tgl{width:38px;height:21px;border-radius:11px;background:#474747;position:relative;flex:0 0 auto;transition:background .25s ease;}
  .tgl::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;
    box-shadow:0 1px 1px rgba(0,0,0,.4);transition:left .25s ease;}
  .tgl.on{background:#33C759;}
  .tgl.on::after{left:19px;}
  .smhint{font-size:11px;color:#878787;margin-top:10px;text-align:center;}

  /* restart illustration */
  .rill{display:flex;align-items:center;gap:10px;margin-top:18px;}
  .rd{width:9px;height:9px;border-radius:50%;background:var(--faint);}
  .rd.lit{background:var(--teal);box-shadow:0 0 8px var(--teal);}
  .rill span{font-size:11px;color:var(--faint);}

  /* automation — the macOS "control Excel" dialog mock */
  .xdlg{flex:0 0 280px;display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:20px 18px 16px;border-radius:12px;background:#2A2A2A;border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 30px rgba(0,0,0,.85);}
  .xt{font-size:13px;font-weight:600;color:#E6E6E6;line-height:1.35;margin-top:12px;}
  .xb{font-size:11px;font-weight:300;color:#B3B3B3;line-height:1.4;margin:6px 0 16px;}
  .xbtns{display:flex;gap:8px;width:100%;}
  .xno,.xok{flex:1;padding:7px 0;border-radius:7px;font-size:12px;}
  .xno{color:#D9D9D9;background:rgba(255,255,255,.10);}
  .xok{color:#fff;font-weight:600;background:#0A85FF;}

  /* done — key rows */
  .keys{width:380px;display:flex;flex-direction:column;gap:10px;}
  .krow{display:flex;align-items:center;gap:14px;padding:11px 15px;border-radius:11px;background:#111116;
    border:1px solid rgba(255,255,255,.07);text-align:left;}
  .kkeys{display:flex;gap:5px;}
  .kk{min-width:24px;padding:4px 8px;border-radius:7px;font-size:12px;color:var(--ink);text-align:center;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);}
  .khold{font-size:8.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--faint);}
  .kdesc{font-size:12.5px;font-weight:300;color:var(--dim);}

  /* connect — guidance note + sign-in card */
  .gnote{display:flex;gap:9px;align-items:flex-start;max-width:460px;margin-top:16px;padding:11px 14px;
    border-radius:12px;background:rgba(106,123,255,.06);border:1px solid rgba(106,123,255,.16);}
  .gnote .dia{color:var(--indigo);font-size:12px;flex:0 0 auto;}
  .gnote .gt{font-size:12px;font-weight:300;color:var(--dim);line-height:1.6;}
  .sicard{width:400px;margin-top:18px;padding:20px;border-radius:16px;background:rgba(12,13,20,.9);
    border:1px solid rgba(255,255,255,.12);}
  .sih{font-size:16.5px;font-weight:600;color:#fff;}
  .sib{font-size:12.5px;font-weight:300;color:var(--dim);line-height:1.55;margin-top:8px;}
  .sibtns{display:flex;justify-content:flex-end;gap:10px;}
  .sibtn{font-size:12.5px;font-weight:500;border-radius:999px;padding:9px 18px;cursor:pointer;}
  .sibtn.ghost{color:var(--dim);background:transparent;border:1px solid rgba(255,255,255,.12);}
  .sibtn.solid{color:#fff;background:var(--indigo);border:0;}
  .siwait{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:11px;color:var(--faint);}
  .spin{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.15);border-top-color:var(--dim);
    animation:spin .8s linear infinite;flex:0 0 auto;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="frame">
    <div class="rail" id="rail"></div>
    <div class="stage"><div class="stagec" id="stage"></div></div>
  </div>

<script>
// ---- native agent bridge (host owns polling + persistence; page just renders) ----
let WIRED=false;
function sendMsg(o){const s=JSON.stringify(o);
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.agent)window.webkit.messageHandlers.agent.postMessage(s);
  else if(window.chrome&&window.chrome.webview)window.chrome.webview.postMessage(s);}
function ui(action,value){const o={type:'ui_action',action:action};if(value!==undefined)o.value=value;sendMsg(o);}
const AGENT={};
window.__onWired=function(){WIRED=true;};
window.__agentMsg=function(s){try{const m=JSON.parse(s);if(AGENT[m.type])AGENT[m.type](m);}catch(e){}};

// ---- state ----
let P={platform:'darwin',mic:false,speech:false,inputMonitoring:false,accessibility:false,screen:false,automation:false,cliToolsPresent:true};
let A={state:'loggedOut',email:''};
let step='welcome';
let interacted=false;         // any user action — after which onboarding_resume is ignored
let finishing=false;          // authorized → single 650ms beat → onboarding_complete
let voiceAsked=false;         // "allow voice" clicked
let speechAsked=false;        // mic granted → chained speech request sent
let recedeTimer=null;

const isWin=()=>P.platform==='win32';
const thisMac=()=>isWin()?'this computer':'this Mac';

// The step order — mirrors OnboardingPermissionsManager.steps. On win32 the
// macOS TCC steps (inputMonitoring/accessibility/screen/restart/automation)
// don't exist: welcome → voice → done → connect.
function steps(){
  if(isWin())return['welcome','voice','done','connect'];
  const s=['welcome'];
  if(!P.cliToolsPresent)s.push('setup');
  return s.concat(['voice','inputMonitoring','accessibility','screen','restart','automation','done','connect']);
}

// The three two-pane Settings steps — copy verbatim from the Swift settingsPhase calls.
const SETTINGS={
  inputMonitoring:{perm:'inputMonitoring',num:'2 of 5 · hold-to-talk',title:'let me <b>catch your hotkey.</b>',
    covers:'covers · input monitoring',
    body:'hold <b>⌃⌥</b> (control-option) in any app to talk to me, then let go when you\'re done. macOS needs to let me watch for that one key combo so it works everywhere.',
    note:'Privacy &amp; Security → Input Monitoring — just flip the switch next to Apprentice.',
    sidebar:'Input Monitoring',sysTitle:'Input Monitoring',
    hint:'flip the toggle so hold-to-talk works in every app.',
    detected:'nice — detected',cta:'nice — next'},
  accessibility:{perm:'accessibility',num:'3 of 5 · point',title:'let me <b>point at things.</b>',
    covers:'covers · accessibility',
    body:'this is how I light up the exact button or cell I mean — and how I click, type, and act for you instead of just describing it.',
    note:'no inline popup here — this one deep-links to System Settings, then I detect the toggle &amp; move on.',
    sidebar:'Accessibility',sysTitle:'Accessibility',
    hint:'I\'m already listed — you just flip the toggle.',
    detected:'nice — detected',cta:'nice — next'},
  screen:{perm:'screen',num:'4 of 5 · see',title:'and let me <b>see your screen.</b>',
    covers:'covers · screen recording + reading window content',
    body:'<b>only when you ask</b> — so I can read what you\'re looking at and find the right thing to point at. I never watch in the background.',
    note:'Privacy &amp; Security → Screen &amp; System Audio Recording. needs one quick restart after (next).',
    sidebar:'Screen Recording',sysTitle:'Screen &amp; System Audio Recording',
    hint:'one toggle covers both recording &amp; reading your windows.',
    detected:'done — detected',cta:'done — next'},
};

function voiceGranted(){return P.mic&&(isWin()||P.speech);}

// ---- step machine ----
function advance(){
  const s=steps(),i=s.indexOf(step);
  if(i<0)return;
  const next=s[Math.min(i+1,s.length-1)];
  if(next===step)return;
  enter(next);
}

// Entering a Settings step fires that step's request (the Swift enter() pre-lists
// + prompts); the automation primer fires its request so the host can prime
// apple-events / confirm screen content. Voice only requests on its CTA.
function enter(s){
  step=s;
  if(SETTINGS[s]&&!P[s])ui('perm_request',SETTINGS[s].perm);
  if(s==='automation')ui('perm_request','automation');
  render();
  if(s==='connect'&&A.state==='authorized')completeAfterLogin();
}

function requestVoice(){
  if(voiceGranted()){advance();return;}
  voiceAsked=true;
  recede(true);              // the OS dialogs take the focus; the card recedes
  ui('perm_request','mic');
}

function tapSettings(){
  if(P[step]){advance();return;}
  ui('perm_request',SETTINGS[step].perm);   // re-open the right pane
}

// Grant flipped true while its step is showing: animate the mock toggle, show
// the detect row, hold the 0.9s beat, advance — mirrors the Swift tick().
function grantDetected(){
  const t=document.getElementById('systoggle');if(t)t.classList.add('on');
  const d=document.getElementById('detect');if(d)d.classList.add('show');
  const c=document.getElementById('cta');if(c)c.textContent=SETTINGS[step].cta.replace(/&amp;/g,'&');
  const s0=step;
  setTimeout(function(){if(step===s0)advance();},900);
}

function recede(on){
  document.getElementById('stage').classList.toggle('recede',on);
  clearTimeout(recedeTimer);
  if(on)recedeTimer=setTimeout(function(){recede(false);},25000);  // denial never flips a frame — let them retry
}

// Authorized on the connect step → hold the "you're in" beat, then finish.
function completeAfterLogin(){
  if(finishing)return;
  finishing=true;
  setTimeout(function(){ui('onboarding_complete');},650);
}

function login(v){
  interacted=true;
  ui('auth_login',v);
  A.state='loggingIn';       // optimistic; the host's auth_state frames correct it
  renderCard();
}

// ---- frames ----
AGENT['perm_state']=function(m){
  const prev=P;
  P={platform:m.platform||prev.platform,mic:!!m.mic,speech:!!m.speech,
     inputMonitoring:!!m.inputMonitoring,accessibility:!!m.accessibility,screen:!!m.screen,
     automation:!!m.automation,cliToolsPresent:m.cliToolsPresent!==false};
  if(P.platform!==prev.platform){render();return;}   // platform reveal → redraw copy/steps
  if(SETTINGS[step]&&P[step]&&!prev[step]){grantDetected();return;}
  if(step==='voice'){
    if(!isWin()&&voiceAsked&&P.mic&&!P.speech&&!speechAsked){speechAsked=true;ui('perm_request','speech');}
    if(voiceGranted()&&!(prev.mic&&(isWin()||prev.speech))){recede(false);advance();}
  }
};

// Pushed by the host on launch after a mid-flow restart (it persists the
// resume point when "quit & reopen" is clicked) — jump straight to that phase,
// e.g. 'automation' after the screen-grant relaunch. Only honoured before any
// user interaction, and only for phases valid on this platform.
AGENT['onboarding_resume']=function(m){
  if(interacted)return;
  if(steps().indexOf(m.step)<0)return;
  enter(m.step);
};

AGENT['auth_state']=function(m){
  A={state:m.state||'loggedOut',email:m.email||''};
  if(step==='connect'){renderCard();if(A.state==='authorized')completeAfterLogin();}
};

// ---- rendering ----
function mark(size,corner){return '<img class="bm" src="apprentice-mark.png" alt="" style="width:'+size+'px;height:'+size+'px;border-radius:'+corner+'px"/>';}
const CK='<span class="ck">✓</span>';

function currentSub(){
  if(isWin())return step==='voice'?0:(step==='done'?1:-1);
  switch(step){
    case 'voice':return 0;
    case 'inputMonitoring':return 1;
    case 'accessibility':return 2;
    case 'screen':case 'restart':return 3;
    case 'automation':case 'done':return 4;
    default:return -1;   // welcome / setup / connect
  }
}

function renderRail(){
  const isC=step==='connect';
  const subs=isWin()?['hear you']:['hear you','hold to talk','point','see your screen','work in your apps'];
  const cur=currentSub();
  function node(idx,title,sub,active,done){
    return '<div class="rnode'+(active?' active':'')+(done?' done':'')+'">'+
      '<div class="ncirc">'+(done?'✓':idx)+'</div>'+
      '<div><div class="nt">'+title+'</div><div class="ns">'+sub+'</div></div></div>';
  }
  let h='<div class="brandrow">'+mark(26,8)+'<span>apprentice</span></div>';
  h+=node(1,'Give access',isWin()?'hear you':'five permissions, one at a time',!isC,isC);
  if(!isC){
    h+='<div class="subs">'+subs.map(function(l,i){
      return '<div class="srow'+(i<cur?' done':i===cur?' cur':'')+'"><span class="sdot"></span><span class="sl">'+l+'</span></div>';
    }).join('')+'</div>';
  }
  h+='<div style="margin-top:4px">'+node(2,'Connect your AI tools','sign in to Claude',isC,false)+'</div>';
  h+='<div class="railspace"></div><div class="railfoot">nothing you say or see leaves '+thisMac()+'. local-first, always.</div>';
  document.getElementById('rail').innerHTML=h;
}

function welcomeHTML(){
  const body=isWin()
    ?'to actually help, Windows needs to let me in — <b>one kind of access</b>. nothing else pops up while we go, and nothing you say or see ever leaves this computer.'
    :'to actually help, macOS needs to let me in — <b>five kinds of access</b>, one at a time. nothing else pops up while we go, and nothing you say or see ever leaves this Mac.';
  const dots=isWin()?['hear you']:['hear you','hotkey','point','see','work in apps'];
  return '<div class="phase center">'+mark(74,20)+
    '<div style="font-size:24px;font-weight:300;color:var(--teal);margin:24px 0 12px">hey — I\'m apprentice.</div>'+
    '<div class="bigtitle"><span class="thin">let\'s get</span><br/><b>you set up.</b></div>'+
    '<div style="font-size:14.5px;font-weight:300;color:var(--dim);line-height:1.75;max-width:460px;margin:14px 0 28px">'+body+'</div>'+
    '<div class="wsteps">'+dots.map(function(s){return '<div class="ws"><span class="wd"></span><span class="wl">'+s+'</span></div>';}).join('')+'</div>'+
    '<button class="btn" id="cta">let\'s go</button></div>';
}

function setupHTML(){
  return '<div class="phase col560"><div class="pnum">first</div>'+
    '<div class="ptitle">first, a <b>one-time setup.</b></div>'+
    '<div style="font-size:10px;font-weight:300;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);margin-top:10px">shown only if apple\'s tools aren\'t installed yet</div>'+
    '<div class="pbody" style="margin-top:13px">macOS may ask to install <b>Apple\'s command-line tools</b> — a normal ~2-minute download a part of me runs on. if you see it, just hit <b>Install</b>. that\'s the only techy moment, promise.</div>'+
    '<button class="btn" id="cta" style="margin-top:22px">got it</button></div>';
}

function voiceHTML(){
  const body=isWin()
    ?'hold a key and talk — I turn it into words <b>right here on your computer</b> — never me, never the cloud.'
    :'hold a key and talk — I turn it into words <b>right here on your Mac</b> (Apple does the transcribing, never me, never the cloud).';
  const hint=isWin()?'Windows asks once — just your microphone.':'macOS asks twice — mic, then speech. it appears centred.';
  return '<div class="phase col560"><div class="pnum">'+(isWin()?'1 of 1 · voice':'1 of 5 · voice')+'</div>'+
    '<div class="ptitle">let me <b>hear you.</b></div>'+
    '<div class="chip">'+(isWin()?'covers · microphone':'covers · microphone + speech recognition')+'</div>'+
    '<div class="pbody">'+body+'</div>'+
    '<button class="btn" id="cta" style="margin-top:22px">allow voice</button>'+
    '<div style="display:flex;gap:8px;font-size:11.5px;margin-top:18px"><span style="color:var(--indigo)">→</span><span style="color:var(--faint)">'+hint+'</span></div></div>';
}

function sysMock(cfg,on){
  return '<div class="sysmock">'+
    '<div class="smtitle"><span class="tl" style="background:#FF5E57"></span><span class="tl" style="background:#FCBD2E"></span><span class="tl" style="background:#29C740"></span><span class="smt">System Settings</span></div>'+
    '<div class="smbody"><div class="smside"><div class="smrow"><span class="smicon"></span><span>'+cfg.sidebar+'</span></div></div>'+
    '<div class="smmain"><div class="smh">'+cfg.sysTitle+'</div>'+
    '<div class="smapp">'+mark(26,7)+'<span>Apprentice</span><span style="flex:1"></span><span class="tgl'+(on?' on':'')+'" id="systoggle"></span></div></div></div></div>';
}

// The fallback card for when macOS doesn't pre-list Apprentice in the pane.
function revealHTML(){
  return '<button class="revealbtn" id="reveal">'+
    '<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="11" fill="#6A7BFF"/><circle cx="9.7" cy="9.7" r="3.6" fill="none" stroke="#050506" stroke-width="1.5"/><path d="M12.4 12.4 15.3 15.3" stroke="#050506" stroke-width="1.5" stroke-linecap="round"/></svg>'+
    '<span><span class="rt1">Don\'t see “Apprentice” in the list?</span><br/>'+
    '<span class="rt2">Click here and I\'ll pop up in a Finder window — drag me into the list.</span></span></button>';
}

function settingsHTML(cfg){
  const granted=P[step];
  return '<div class="phase settings"><div class="scol">'+
    '<div class="pnum">'+cfg.num+'</div>'+
    '<div class="ptitle">'+cfg.title+'</div>'+
    '<div class="chip">'+cfg.covers+'</div>'+
    '<div class="pbody">'+cfg.body+'</div>'+
    '<div style="display:flex;align-items:center;gap:14px;margin-top:22px">'+
      '<button class="btn" id="cta">'+(granted?cfg.cta:'open the switch')+'</button>'+
      '<span class="detect'+(granted?' show':'')+'" id="detect">'+CK+'<span>'+cfg.detected+'</span></span></div>'+
    revealHTML()+
    '<div class="note">'+cfg.note+'</div></div>'+
    '<div class="smockcol">'+sysMock(cfg,granted)+'<div class="smhint">'+cfg.hint+'</div></div></div>';
}

function restartHTML(){
  return '<div class="phase center"><div class="pnum">almost there</div>'+
    '<div class="ptitle" style="margin-top:14px">one quick <b>restart.</b></div>'+
    '<div style="font-size:14px;font-weight:300;color:var(--dim);line-height:1.6;max-width:460px;margin-top:8px">macOS only hands me the screen after a <b>fresh launch</b> — so I\'ll close and reopen myself. two seconds, and you won\'t lose your place: I\'ll pick up <b>right here.</b></div>'+
    '<div class="rill"><span class="rd lit"></span><span class="rd"></span><span class="rd"></span><span>close → reopen → right back here</span></div>'+
    '<button class="btn" id="cta" style="margin-top:18px">quit &amp; reopen</button></div>';
}

function automationHTML(){
  return '<div class="phase settings"><div class="scol">'+
    '<div class="chip" style="margin:0 0 18px">'+CK+'<span>back already — I can see your screen now</span></div>'+
    '<div class="pnum">5 of 5 · work in your apps</div>'+
    '<div class="ptitle">let me <b>work across your apps.</b></div>'+
    '<div class="chip">covers · automation (apple events)</div>'+
    '<div class="pbody">to update a spreadsheet, save a file, or add a calendar event, I drive your other apps for you. there\'s no switch to flip now — the <b>first time</b> I touch an app, macOS asks once. just hit <b>OK</b>. I only ever touch the app you asked me to.</div>'+
    '<button class="btn" id="cta" style="margin-top:22px">got it</button>'+
    '<div class="note" style="max-width:300px">this is what you\'ll see when it first comes up — one time per app.</div></div>'+
    '<div class="xdlg">'+mark(46,11)+
    '<div class="xt">“Apprentice” wants access to control “Microsoft Excel”.</div>'+
    '<div class="xb">Allowing control will provide access to documents and data in “Microsoft Excel,” and to perform actions within that app.</div>'+
    '<div class="xbtns"><span class="xno">Don\'t Allow</span><span class="xok">OK</span></div></div></div>';
}

function doneHTML(){
  const k1=isWin()?['Ctrl','Alt']:['⌃','⌥'];
  const k2=isWin()?['Ctrl','Alt','S']:['⌘','⌥','S'];
  function krow(keys,hold,desc){
    return '<div class="krow"><span class="kkeys">'+keys.map(function(k){return '<span class="kk">'+k+'</span>';}).join('')+'</span>'+
      (hold?'<span class="khold">hold</span>':'')+'<span class="kdesc">'+desc+'</span></div>';
  }
  return '<div class="phase center">'+mark(62,17)+
    '<div class="ptitle" style="margin-top:16px">access <b>all set.</b></div>'+
    '<div style="font-size:14px;font-weight:300;color:var(--dim);max-width:440px;margin:8px 0 18px">two keys worth knowing — the rest live under <b>Keys</b> in Summon whenever you want them.</div>'+
    '<div class="keys">'+
      krow(k1,true,'hold to talk to me — let go when you\'re done')+
      krow(k2,false,'your control panel — ask me things, check on my work, change settings')+
    '</div>'+
    '<button class="btn teal" id="cta" style="margin-top:26px">last step — connect Claude</button></div>';
}

function connectHTML(){
  return '<div class="phase" style="width:480px"><div class="pnum">step 2 · connect your AI tools</div>'+
    '<div class="ptitle">connect the <b>brain.</b></div>'+
    '<div class="gnote"><span class="dia">◆</span><span class="gt">last thing before we start — apprentice thinks with <b>your</b> Claude account. you\'ll sign in once in the browser; your subscription stays entirely on your side, and I never see your password.</span></div>'+
    '<div class="sicard" id="sicard"></div></div>';
}

// The sign-in card mirrors the auth states 1:1 (Swift signInCard).
function renderCard(){
  const card=document.getElementById('sicard');
  if(!card)return;
  const btns='<div class="sibtns"><button class="sibtn ghost" id="siConsole">Use API billing</button><button class="sibtn solid" id="siClaude">Sign in with Claude</button></div>';
  let h;
  switch(A.state){
    case 'loggingIn':
      h='<div class="sih">finishing up in your browser</div>'+
        '<div class="sib">complete the sign-in in the tab that just opened — I\'ll pick it up automatically.</div>'+
        '<div class="siwait"><span class="spin"></span><span>waiting for you…</span></div>';break;
    case 'authorized':
      h='<div class="sih">you\'re in ✓</div><div class="sib">getting things ready…</div>';break;
    case 'freeTier':
      h='<div class="sih">you\'re on the free Claude plan</div>'+
        '<div class="sib" style="margin-bottom:16px">Apprentice needs a paid plan — upgrade to Claude Pro or Max, or use pay-as-you-go API billing.</div>'+btns;break;
    case 'error':
      h='<div class="sih">couldn\'t start sign-in</div>'+
        '<div class="sib" style="margin-bottom:16px">I couldn\'t reach the Claude sign-in on '+thisMac()+'. Give it another go below, or use API billing.</div>'+btns;break;
    default:
      h='<div class="sih">let\'s get you signed in</div>'+
        '<div class="sib" style="margin-bottom:16px">connect your Claude account to begin — use your <b>Pro or Max</b> subscription, or pay-as-you-go <b>API billing</b>. either one opens in your browser.</div>'+btns;
  }
  card.innerHTML=h;
  const cc=document.getElementById('siConsole');if(cc)cc.onclick=function(){login('console');};
  const cl=document.getElementById('siClaude');if(cl)cl.onclick=function(){login('claudeai');};
}

function phaseHTML(){
  switch(step){
    case 'welcome':return welcomeHTML();
    case 'setup':return setupHTML();
    case 'voice':return voiceHTML();
    case 'restart':return restartHTML();
    case 'automation':return automationHTML();
    case 'done':return doneHTML();
    case 'connect':return connectHTML();
    default:return settingsHTML(SETTINGS[step]);
  }
}

function ctaAction(){
  interacted=true;
  switch(step){
    case 'voice':requestVoice();break;
    case 'restart':ui('onboarding_restart_app');break;
    case 'welcome':case 'setup':case 'automation':case 'done':advance();break;
    default:if(SETTINGS[step])tapSettings();
  }
}

function renderStage(){
  const stage=document.getElementById('stage');
  stage.classList.remove('recede');
  stage.innerHTML=phaseHTML();
  const cta=document.getElementById('cta');
  if(cta)cta.addEventListener('click',ctaAction);
  const rv=document.getElementById('reveal');
  if(rv)rv.addEventListener('click',function(){ui('onboarding_reveal_app');});
  if(step==='connect')renderCard();
}

function render(){renderRail();renderStage();}

// Enter advances where a single CTA exists (connect's two buttons have no #cta).
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  const c=document.getElementById('cta');
  if(c)c.click();
});

render();
</script>
</body>
</html>
