<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Apprentice Video</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  /* ── Apprentice video editor #1 — ⌘⌥V cut reviewer, ported 1:1 from
     VideoEditorWindowManager/Chrome/TimelineView/InspectorPane/BottomDrawer/
     Captions/Player/State .swift (apprentice-mac). Ground #0a0d0d. ── */
  :root{
    --blue:#6EAAFF; --green:#5BE0A6; --dred:#ff6b6b; --oamber:#FFB347;
    --purp:#c08bff; --semantic:#6ec1ff;
    --w92:rgba(255,255,255,.92); --w85:rgba(255,255,255,.85); --w75:rgba(255,255,255,.75);
    --w70:rgba(255,255,255,.7);  --w60:rgba(255,255,255,.6);  --w55:rgba(255,255,255,.55);
    --w50:rgba(255,255,255,.5);  --w45:rgba(255,255,255,.45); --w40:rgba(255,255,255,.4);
    --w35:rgba(255,255,255,.35); --w30:rgba(255,255,255,.3);  --w25:rgba(255,255,255,.25);
  }
  html,body{background:#0a0d0d;overflow:hidden;height:100%;}
  body{display:flex;flex-direction:column;font-family:var(--font);user-select:none;-webkit-user-select:none;}
  button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;padding:0;}
  .ic{display:inline-block;vertical-align:middle;flex:none;}
  .mono{font-family:var(--mono);}

  /* ═══ Titlebar (44px) ═══ */
  #titlebar{height:44px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;
    background:linear-gradient(to bottom,rgba(255,255,255,.04),rgba(255,255,255,.01));
    border-bottom:1px solid rgba(255,255,255,.07);-webkit-app-region:drag;position:relative;z-index:20;}
  #titlebar button,#titlebar select{-webkit-app-region:no-drag;}
  .tl-reserve{width:78px;flex:none;}
  #modeTabs{display:flex;gap:2px;padding:3px;background:rgba(0,0,0,.3);border-radius:7px;
    border:1px solid rgba(255,255,255,.05);}
  .modetab{font-size:10.5px;font-weight:600;letter-spacing:.7px;color:var(--w55);
    padding:5px 13px;border-radius:5px;text-transform:uppercase;}
  .modetab.dis{color:var(--w30);}
  .modetab.on{color:var(--blue);background:rgba(110,170,255,.16);}
  #projectChrome{display:flex;align-items:center;gap:8px;margin:0 auto;}
  #projectChrome .pn{font-size:12px;font-weight:600;color:var(--w92);}
  #projectChrome .pn.dim{color:var(--w70);}
  #projectChrome .src{font-family:var(--mono);font-size:11px;color:var(--w70);
    padding:2px 7px;background:rgba(255,255,255,.05);border-radius:4px;}
  #tbRight{display:flex;align-items:center;gap:8px;}
  .chip-render{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;color:var(--green);
    padding:3px 9px;background:rgba(91,224,166,.12);border-radius:10px;border:1px solid rgba(91,224,166,.3);}
  .chip-render .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
  .chromebtn{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--w60);
    padding:5px 9px;background:rgba(255,255,255,.04);border-radius:5px;border:1px solid rgba(255,255,255,.06);}
  .chromebtn:hover{color:var(--w85);}

  /* ═══ Layout ═══ */
  #mainRow{flex:1;display:flex;min-height:0;}
  /* left nav rail — 60px */
  #navRail{width:60px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:10px 0;background:rgba(255,255,255,.025);border-right:1px solid rgba(255,255,255,.05);}
  .navdiv{width:24px;height:1px;background:rgba(255,255,255,.07);margin:3px 0;flex:none;}
  .navsp{flex:1;}
  .navbtn{position:relative;width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;
    border-radius:8px;color:var(--w45);}
  .navbtn:hover{background:rgba(255,255,255,.05);color:var(--w75);}
  .navbtn.on{background:rgba(110,170,255,.14);color:var(--blue);}
  .navbtn.on::before{content:'';position:absolute;left:-2px;top:10px;width:3px;height:22px;
    border-radius:1.5px;background:var(--blue);}
  #workspace{flex:1;min-width:0;display:flex;position:relative;}

  /* ═══ Stubs (mode / nav / empty) ═══ */
  .stub{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:#0a0d0d;text-align:center;padding:0 24px;}
  .stub .sic{color:rgba(255,255,255,.18);}
  .stub .t1{font-size:16px;font-weight:600;color:var(--w75);}
  .stub .t1b{font-size:15px;font-weight:600;color:var(--w70);}
  .stub .t2{font-size:12px;color:var(--w40);max-width:380px;line-height:1.45;}
  .stub .t3{font-family:var(--mono);font-size:10px;color:var(--w25);}
  .stub .t2m{font-family:var(--mono);font-size:11px;color:var(--w30);}
  #emptyBody{gap:16px;}
  #emptyBody .t1{color:#fff;}
  #emptyBody .t2{font-size:12px;color:var(--w50);white-space:pre-line;}
  #emptyBody .foot{position:absolute;bottom:18px;font-family:var(--mono);font-size:10px;color:var(--w25);}

  /* ═══ Editor body ═══ */
  #editorBody{flex:1;min-width:0;display:flex;align-items:stretch;}
  #mainCol{flex:1;min-width:0;display:flex;flex-direction:column;}
  /* header */
  #edHeader{display:flex;align-items:center;gap:14px;padding:16px 18px 8px;}
  #edHeader .name{font-size:14px;font-weight:600;color:#fff;}
  #edHeader .sess{font-family:var(--mono);font-size:11px;color:var(--w40);}
  #edHeader .sp{flex:1;}
  #renderBtn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#000;
    padding:7px 14px;background:var(--blue);border-radius:7px;}
  #renderBtn.busy{background:var(--green);cursor:default;}
  .spinner{width:12px;height:12px;border:2px solid rgba(0,0,0,.25);border-top-color:#000;
    border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* stats */
  #edStats{display:flex;align-items:center;gap:18px;padding:0 18px 8px;}
  .statblk .k{font-size:9px;font-weight:600;letter-spacing:.6px;color:var(--w40);text-transform:uppercase;}
  .statblk .v{font-family:var(--mono);font-size:13px;font-weight:600;color:#fff;margin-top:2px;}
  #edStats .arr{color:var(--w30);}
  /* preview */
  #previewWrap{margin:0 18px;display:flex;justify-content:center;}
  #previewBox{position:relative;background:#000;border-radius:8px;overflow:hidden;
    max-height:360px;aspect-ratio:16/9;max-width:100%;}
  #vid{width:100%;height:100%;display:block;background:#000;}
  #ovl{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  #buildVeil{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;
    align-items:center;justify-content:center;}
  .capBlock{position:absolute;pointer-events:auto;cursor:move;padding:6px;text-align:center;
    transform:translate(-50%,-50%);line-height:1.15;}
  .capBlock.sel{outline:1.5px dashed var(--semantic);outline-offset:0;border-radius:6px;}
  .capHandle{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;border-radius:50%;
    background:var(--semantic);cursor:nwse-resize;pointer-events:auto;}
  /* transport */
  #transport{display:flex;align-items:center;gap:10px;margin:6px 18px 0;padding:4px 10px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:6px;}
  #playBtn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    color:var(--w85);border-radius:5px;}
  #playBtn:hover{background:rgba(255,255,255,.06);}
  #scrub{flex:1;appearance:none;-webkit-appearance:none;height:4px;border-radius:2px;
    background:rgba(255,255,255,.1);outline:none;}
  #scrub::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:11px;height:11px;
    border-radius:50%;background:var(--blue);box-shadow:0 0 4px rgba(110,170,255,.8);cursor:pointer;}
  #timeRO{font-family:var(--mono);font-size:10.5px;color:var(--w55);flex:none;}
  /* dividers */
  .hdiv{height:1px;background:rgba(255,255,255,.08);flex:none;}
  /* ═══ timeline ribbon ═══ */
  #tlHeader{display:flex;align-items:center;gap:14px;padding:8px 16px;background:rgba(255,255,255,.015);
    border-bottom:1px solid rgba(255,255,255,.05);flex:none;}
  #tlStats{display:flex;align-items:center;gap:12px;}
  #tlStats .nm{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.9);}
  .tstat{display:flex;align-items:center;gap:4px;}
  .tstat .k{font-size:10px;color:var(--w35);}
  .tstat .v{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--w85);}
  #tlHeader .sp{flex:1;}
  .zoomrow{display:flex;align-items:center;gap:6px;}
  .zoomrow .zl{font-size:9.5px;color:var(--w30);}
  .zoomtrack{position:relative;width:90px;height:4px;border-radius:2px;background:rgba(255,255,255,.08);}
  .zoomtrack .knob{position:absolute;left:54px;top:-3px;width:10px;height:10px;border-radius:50%;
    background:#fff;box-shadow:0 0 2px rgba(0,0,0,.4);}
  .togglepill{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--w40);
    padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);}
  .togglepill .sw{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.15);}
  .togglepill.on{color:var(--blue);background:rgba(110,170,255,.14);border-color:rgba(110,170,255,.3);}
  .togglepill.on .sw{background:var(--blue);}
  #tracksArea{position:relative;padding:6px 16px;min-height:240px;flex:none;}
  .trow{display:flex;align-items:center;margin-bottom:4px;}
  .tgutter{width:88px;flex:none;display:flex;align-items:center;gap:4px;color:var(--w40);}
  .tgutter .lk{color:rgba(255,255,255,.18);}
  .tgutter .tn{font-size:9px;font-weight:600;letter-spacing:1px;color:var(--w40);text-transform:uppercase;}
  .tcontent{position:relative;flex:1;min-width:0;background:rgba(255,255,255,.025);border-radius:4px;overflow:hidden;}
  .temptyrow{display:flex;align-items:center;gap:4px;height:100%;padding-left:10px;font-size:9.5px;}
  .temptyrow .m{font-style:italic;color:var(--w25);}
  .temptyrow .h{color:rgba(110,170,255,.5);}
  #waveCanvas{position:absolute;inset:0;width:100%;height:100%;}
  .cutband{position:absolute;top:3px;height:50px;border-radius:2px;opacity:.85;cursor:pointer;min-width:2px;}
  .cutband.sel{opacity:1;outline:1.5px solid #fff;box-shadow:0 0 8px var(--bandc);}
  .capblk{position:absolute;top:3px;height:30px;min-width:2px;border-radius:2px;cursor:pointer;
    background:rgba(192,139,255,.2);border-left:2px solid var(--purp);overflow:hidden;
    display:flex;align-items:center;padding:0 6px;font-size:9px;color:var(--purp);white-space:nowrap;}
  .capblk.sel{background:rgba(192,139,255,.42);border-left-width:3px;}
  .musblk{position:absolute;top:3px;height:30px;min-width:2px;border-radius:3px;overflow:hidden;
    background:linear-gradient(to bottom,rgba(110,218,156,.3),rgba(110,218,156,.5));
    border-left:2px solid #6eda9c;display:flex;align-items:center;gap:6px;padding:0 6px;}
  .musblk .ml{font-size:9.5px;font-weight:600;color:#6eda9c;white-space:nowrap;}
  .musblk .bpm{font-family:var(--mono);font-size:8.5px;color:rgba(110,218,156,.7);
    padding:1px 5px;background:rgba(0,0,0,.3);border-radius:3px;margin-left:auto;}
  .mpin{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;}
  .mpin .tag{width:18px;height:12px;border-radius:2px;background:var(--oamber);color:#000;
    font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .mpin .stem{width:2px;flex:1;background:var(--oamber);min-height:8px;}
  #playheadLayer{position:absolute;top:6px;bottom:6px;left:104px;right:16px;pointer-events:none;}
  #playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--blue);
    box-shadow:0 0 6px var(--blue);opacity:.95;}
  #timeRuler{position:relative;height:18px;margin:0 16px 6px 104px;flex:none;}
  #timeRuler span{position:absolute;top:2px;transform:translateX(-50%);
    font-family:var(--mono);font-size:8.5px;color:var(--w40);}
  /* ═══ cut list ═══ */
  #cutList{flex:1;min-height:0;overflow-y:auto;padding:8px 16px;}
  .cutrow{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:4px;cursor:pointer;}
  .cutrow.sel{background:rgba(255,255,255,.06);}
  .cutrow .sw{width:3px;height:22px;border-radius:2px;flex:none;}
  .cutrow .idx{font-family:var(--mono);font-size:10px;color:var(--w40);width:24px;text-align:right;flex:none;}
  .cutrow .rng{font-family:var(--mono);font-size:11px;color:var(--w70);width:130px;flex:none;}
  .cutrow .dur{font-family:var(--mono);font-size:10px;color:var(--w40);width:50px;text-align:right;flex:none;}
  .cutrow .srcn{font-size:10px;font-weight:600;width:100px;flex:none;}
  .cutrow .rsn{font-family:var(--mono);font-size:10px;color:var(--w30);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;min-width:0;}
  #removedHead{display:flex;align-items:center;gap:6px;margin:4px 0;color:var(--w50);}
  #removedHead .rt{font-size:9.5px;font-weight:600;letter-spacing:.7px;}
  #removedHead .rc{font-family:var(--mono);font-size:9.5px;color:var(--w35);}
  .remdiv{height:1px;background:rgba(255,255,255,.08);margin:12px 0 4px;}
  .remrow{display:flex;align-items:center;gap:10px;padding:4px 8px;opacity:.85;}
  .remrow .sw{width:3px;height:18px;border-radius:2px;opacity:.5;flex:none;}
  .remrow .rid{font-family:var(--mono);font-size:10px;color:var(--w35);width:90px;flex:none;}
  .remrow .rng{font-family:var(--mono);font-size:11px;color:var(--w50);width:130px;flex:none;
    text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3);}
  .remrow .dur{font-family:var(--mono);font-size:10px;color:var(--w35);width:50px;text-align:right;flex:none;}
  .remrow .srcn{font-size:10px;font-weight:600;width:100px;flex:none;opacity:.7;}
  .remrow .sp{flex:1;}
  .restoreBtn{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--blue);
    padding:4px 9px;background:rgba(110,170,255,.1);border-radius:4px;}
  /* ═══ bottom drawer ═══ */
  #drawer{flex:none;background:#0b0e0e;border-top:1px solid rgba(255,255,255,.08);}
  #drawerHead{display:flex;align-items:center;height:36px;padding:0 12px;}
  .dtab{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--w50);
    padding:5px 10px;border-radius:5px;}
  .dtab.on{color:#fff;font-weight:600;background:rgba(255,255,255,.07);}
  #drawerHead .sp{flex:1;}
  #wordCount{font-family:var(--mono);font-size:10px;color:var(--w35);margin-right:12px;}
  #chevBtn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    color:var(--w50);background:rgba(255,255,255,.04);border-radius:4px;}
  #drawerBody{height:220px;background:#0d0f0f;border-top:1px solid rgba(255,255,255,.05);
    overflow-y:auto;display:flex;flex-direction:column;}
  #drawerBody .stubwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:0 32px;text-align:center;}
  .libtitle{font-size:12.5px;font-weight:600;color:var(--w60);}
  .libhint{font-size:10.5px;color:rgba(255,255,255,.32);}
  #transcriptScroll{padding:10px 16px;}
  .sentence{margin-bottom:10px;line-height:1.7;}
  .wchip{display:inline-block;font-size:12.5px;color:var(--w85);padding:1px 3px;border-radius:3px;
    cursor:pointer;}
  .wchip.rm{color:var(--w35);text-decoration:line-through;text-decoration-color:rgba(255,107,107,.7);}
  .wchip.cur{color:#fff;background:rgba(110,170,255,.35);}
  .tempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;}
  .tempty .e1{font-size:12px;font-weight:600;color:var(--w55);}
  .tempty .e2{font-family:var(--mono);font-size:10.5px;color:var(--w30);white-space:pre-line;}
  /* ═══ footer ═══ */
  #footer{display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(255,255,255,.02);flex:none;}
  #footer .ver{font-family:var(--mono);font-size:9.5px;color:var(--w30);}
  #footer .sp{flex:1;}
  #undoBtn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--w70);
    padding:6px 12px;background:rgba(255,255,255,.05);border-radius:5px;}
  #undoBtn:disabled{opacity:.4;cursor:default;}
  /* ═══ inspector pane ═══ */
  #inspector{width:320px;flex:none;display:flex;flex-direction:column;
    background:rgba(255,255,255,.015);border-left:1px solid rgba(255,255,255,.08);}
  #inspTabs{display:flex;background:rgba(0,0,0,.2);flex:none;}
  .itab{flex:1;padding-top:8px;display:flex;flex-direction:column;gap:3px;align-items:center;}
  .itab .il{font-size:9px;font-weight:600;letter-spacing:.6px;color:var(--w45);text-transform:uppercase;}
  .itab .iu{height:2px;width:100%;background:transparent;}
  .itab.on{background:rgba(110,170,255,.06);}
  .itab.on .il{color:var(--blue);}
  .itab.on .iu{background:var(--blue);}
  #inspBody{flex:1;overflow-y:auto;padding:12px;border-top:1px solid rgba(255,255,255,.06);}
  .secHead{font-size:9px;font-weight:600;letter-spacing:.7px;color:var(--w40);
    text-transform:uppercase;padding:8px 0 5px;}
  .card{background:rgba(255,255,255,.04);border-radius:7px;padding:11px;margin-bottom:9px;}
  .kv{display:flex;justify-content:space-between;gap:8px;margin:3px 0;}
  .kv .k{font-family:var(--mono);font-size:10px;color:var(--w40);flex:none;}
  .kv .v{font-family:var(--mono);font-size:10px;color:var(--w85);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;text-align:right;}
  .srcbadge{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.4px;color:#fff;
    padding:2px 6px;border-radius:3px;text-transform:uppercase;margin-bottom:5px;}
  .aiNote{display:flex;gap:4px;font-size:10.5px;color:var(--w70);padding:8px;margin:6px 0;
    background:rgba(110,170,255,.07);border-left:2px solid var(--blue);border-radius:4px;line-height:1.4;}
  .actrow{display:flex;gap:6px;margin-top:8px;}
  .abtn{font-size:10.5px;font-weight:600;color:var(--w75);padding:4px 9px;border-radius:4px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);}
  .abtn.danger{color:var(--dred);background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.3);}
  .featcard{display:flex;align-items:center;gap:10px;padding:11px;border-radius:7px;
    background:rgba(255,255,255,.04);margin-bottom:9px;}
  .featcard.hi{background:linear-gradient(to right,rgba(110,170,255,.06),rgba(91,224,166,.03));
    border:1px solid rgba(110,170,255,.15);}
  .featcard .fic{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.05);
    display:flex;align-items:center;justify-content:center;color:var(--w55);flex:none;}
  .featcard.hi .fic{width:28px;height:28px;background:rgba(110,170,255,.15);color:var(--blue);}
  .featcard .ft{flex:1;min-width:0;}
  .featcard .f1{font-size:11.5px;font-weight:600;color:var(--w85);}
  .featcard.hi .f1{color:#fff;}
  .featcard .f2{font-size:9.5px;color:var(--w40);margin-top:1px;}
  .featcard.hi .f2{color:var(--w45);}
  .pswitch{position:relative;width:30px;height:16px;border-radius:8px;background:rgba(255,255,255,.1);flex:none;}
  .pswitch::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;
    background:rgba(255,255,255,.7);}
  .sliderStat{position:relative;height:12px;display:flex;align-items:center;margin:4px 0;}
  .sliderStat .trk{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.08);}
  .sliderStat .knob{position:absolute;top:0;width:12px;height:12px;border-radius:50%;background:#fff;
    box-shadow:0 0 2px rgba(0,0,0,.4);}

<!-- ═══ 44px titlebar ═══ -->

</div>

<!-- ═══ render toast (pinned below titlebar) ═══ -->
<div id="toastWrap" class="hide"></div>

<div id="mainRow">

  <div id="workspace">

    <!-- workspace stub (mode != edit, or nav != editor) -->

      <span class="sic" id="emptyIcon"></span>
      <div class="t1">No edit session loaded</div>
      <div class="t2">Run `clean.py &lt;video&gt;` from the terminal,
then say "open my last edit".</div>
      <div class="foot">V5 Phase 3a · foundation shell · full UI in 3b</div>

    <!-- editor body -->
    <div id="editorBody" style="display:none">

          <button id="renderBtn"></button>

        <div id="edStats"></div>
        <div id="previewWrap">

            <video id="vid" playsinline></video>

          </div>
        </div>
        <div id="transport">
          <button id="playBtn"></button>
          <input type="range" id="scrub" min="0" max="100" step="0.01" value="0"/>
          <span id="timeRO">0:00.00 / 0:00.00</span>

        <div id="tlHeader">
          <div id="tlStats"></div>
          <span class="sp"></span>
          <div class="zoomrow"><span class="zl">zoom</span>
            <div class="zoomtrack"><div class="knob"></div></div></div>
          <button class="togglepill" id="beatSnap"><span class="sw"></span>Beat snap</button>
          <button class="togglepill on" id="cutSnap"><span class="sw"></span>Snap to cut</button>
        </div>
        <div id="tracksArea">
          <div id="trackRows"></div>
          <div id="playheadLayer"><div id="playhead"></div></div>
        </div>
        <div id="timeRuler"></div>
        <div class="hdiv"></div>
        <div id="cutList"></div>
        <!-- bottom drawer -->
        <div id="drawer">
          <div id="drawerHead"></div>
          <div id="drawerBody"></div>
        </div>
        <!-- footer -->
        <div id="footer">
          <span class="ver">V5 Phase 3a · foundation shell</span>
          <span class="sp"></span>
          <button id="undoBtn"></button>
        </div>
      </div>
      <!-- inspector pane -->
      <div id="inspector">
        <div id="inspTabs"></div>
        <div id="inspBody"></div>
      </div>
    </div>

  </div>
</div>

/* ─── VideoEditorCutSourceColor ─── */

/* ─── time formatting (mirrors Swift fmtTime / fmtShort) ─── */
function fmtTime(s){s=num(s);const m=Math.floor(s/60),sec=s-m*60;
  return `${m}:${sec.toFixed(2).padStart(5,'0')}`;}
function fmtShort(s){s=num(s);const m=Math.floor(s/60),sec=Math.floor(s-m*60);

function relTime(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return iso;

  return `${Math.floor(dt/86400)}d ago`;}

/* ═════════════════════════ timeline parsing (VideoEditorState.parse mirror) ═════════════════════════ */
function parseTimeline(j){
  if(!j||typeof j.session_id!=='string'||!j.session_id)return null;
  const sp=j.source_path||'';
  const base=sp.split(/[\\/]/).pop()||'—';
  const t={
    sessionId:j.session_id, sourcePath:sp, sourceName:base||'—',
    sourceDurationS:num(j.source_duration_s), outputDurationS:num(j.output_duration_s),
    removedS:num(j.removed_s),
    cutsTotal:num(j.cuts_total), cutsAfterMerge:num(j.cuts_after_merge),
    historyDepth:num(j.history_depth),
    bySourceCount:(j.by_source_count&&typeof j.by_source_count==='object')?j.by_source_count:{},
    cuts:[], removedCuts:[], recentHistory:[], transcriptWords:[],
    captions:null, captionTrack:null, music:null, markers:null,
  };
  (Array.isArray(j.cuts)?j.cuts:[]).forEach(d=>{ if(!d||!d.id)return;
    const st=num(d.start_s),en=num(d.end_s);
    t.cuts.push({id:String(d.id),index:num(d.index),startS:st,endS:en,
      source:d.source||'manual',reason:d.reason||'',
      durS:num(d.dur_s,Math.max(0,en-st)),aiReasoning:(typeof d.ai_reasoning==='string')?d.ai_reasoning:null});});
  (Array.isArray(j.removed_cuts)?j.removed_cuts:[]).forEach(d=>{ if(!d||!d.id)return;
    const st=num(d.start_s),en=num(d.end_s);
    t.removedCuts.push({id:String(d.id),startS:st,endS:en,source:d.source||'manual',
      reason:d.reason||'',durS:num(d.dur_s,Math.max(0,en-st)),removedAtISO:d.removed_at_iso||''});});
  (Array.isArray(j.recent_history)?j.recent_history:[]).forEach((d,i)=>{ if(!d)return;
    const name=d.name||'op', a=(d.args&&typeof d.args==='object')?d.args:{};
    let sum='';
    if(typeof a.cut_id==='string')sum=a.cut_id;
    if(typeof a.delta_s==='number'){sum+=(sum?' · ':'')+(a.delta_s>=0?'+':'')+a.delta_s.toFixed(2)+'s';}
    if(typeof a.side==='string'&&a.side)sum+=(sum?' · ':'')+a.side;
    if(typeof a.start==='number'&&typeof a.end==='number')sum+=(sum?' · ':'')+`${a.start.toFixed(2)}-${a.end.toFixed(2)}s`;
    t.recentHistory.push({index:i,name,argsSummary:sum,tsISO:d.ts_iso||''});});
  (Array.isArray(j.transcript_words)?j.transcript_words:[]).forEach((d,i)=>{ if(!d)return;
    const tx=String(d.text||'').trim(); if(!tx)return;
    t.transcriptWords.push({id:i,text:tx,startS:num(d.start,num(d.start_s)),endS:num(d.end,num(d.end_s))});});
  if(Array.isArray(j.captions)){
    t.captions=j.captions.filter(d=>d&&d.id).map(d=>({
      id:String(d.id),startS:num(d.start_s),endS:num(d.end_s),text:String(d.text||''),
      words:(Array.isArray(d.words)?d.words:[]).map((w,i)=>({id:i,text:String((w&&w.text)||''),
        startS:num(w&&w.start_s),endS:num(w&&w.end_s),emphasis:(w&&w.emphasis)||'none'})),
      style:parseStyle(d.resolved_style)}));}
  if(j.caption_track&&typeof j.caption_track==='object'){
    t.captionTrack={defaultStyle:parseStyle(j.caption_track.default_style),
      presets:Array.isArray(j.caption_track.presets)?j.caption_track.presets.map(String):[]};}
  if(Array.isArray(j.music)){
    t.music=j.music.filter(d=>d&&d.id).map(d=>({id:String(d.id),offsetS:num(d.offset_s),
      durationS:num(d.duration_s),label:d.label||'music',
      bpm:(typeof d.bpm==='number')?d.bpm:null,duckUnderVoice:d.duck_under_voice!==false}));}
  if(Array.isArray(j.markers)){
    t.markers=j.markers.filter(d=>d&&d.id).map(d=>({id:String(d.id),startS:num(d.start_s),label:d.label||''}));}
  return t;
}

/* ─── CaptionStyle mirror ─── */
function defaultStyle(){return{name:'Creator',font:'Montserrat',weight:'black',sizePct:0.052,
  textCase:'upper',letterSpacing:0,fill:'#FFFFFF',highlight:'#38BDF8',stroke:'#000000',
  strokePctOfFont:0.06,outlineEnabled:true,shadow:true,box:false,boxColor:'#000000',
  emphLow:'#FFFFFF',emphMed:'#FFFFFF',emphHigh:'#38BDF8',technique:'scale_pop',scale:1.06,
  karaoke:true,position:'lower_third',align:'center',safeMarginVPct:0.20,marginHPct:0.08,
  xPct:null,yPct:null};}
function parseStyle(d){const s=defaultStyle();if(!d||typeof d!=='object')return s;
  if(typeof d.name==='string')s.name=d.name;
  const t=d.typography||{};
  if(typeof t.font==='string')s.font=t.font;
  if(typeof t.weight==='string')s.weight=t.weight;
  if(typeof t.size_pct==='number')s.sizePct=t.size_pct;
  if(typeof t.case==='string')s.textCase=t.case;
  if(typeof t.letter_spacing==='number')s.letterSpacing=t.letter_spacing;
  const c=d.color||{};
  if(typeof c.fill==='string')s.fill=c.fill;
  if(typeof c.highlight==='string')s.highlight=c.highlight;
  if(typeof c.stroke==='string')s.stroke=c.stroke;
  if(typeof c.stroke_px_pct==='number')s.strokePctOfFont=c.stroke_px_pct;
  if(typeof c.outline_enabled==='boolean')s.outlineEnabled=c.outline_enabled;
  if(typeof c.shadow==='boolean')s.shadow=c.shadow;
  if(typeof c.box==='boolean')s.box=c.box;
  if(typeof c.box_color==='string')s.boxColor=c.box_color;
  const em=c.emphasis_colors||{};
  if(typeof em.low==='string')s.emphLow=em.low;
  if(typeof em.med==='string')s.emphMed=em.med;
  if(typeof em.high==='string')s.emphHigh=em.high;
  const h=d.highlight||{};
  if(typeof h.technique==='string')s.technique=h.technique;
  if(typeof h.scale==='number')s.scale=h.scale;
  if(typeof h.karaoke==='boolean')s.karaoke=h.karaoke;
  const l=d.layout||{};
  if(typeof l.position==='string')s.position=l.position;
  if(typeof l.align==='string')s.align=l.align;
  if(typeof l.safe_margin_v_pct==='number')s.safeMarginVPct=l.safe_margin_v_pct;
  if(typeof l.margin_h_pct==='number')s.marginHPct=l.margin_h_pct;
  if(typeof l.x_pct==='number')s.xPct=l.x_pct;
  if(typeof l.y_pct==='number')s.yPct=l.y_pct;
  return s;}
function styleAsDict(s){return{name:s.name,
  typography:{font:s.font,weight:s.weight,size_pct:s.sizePct,'case':s.textCase,letter_spacing:s.letterSpacing},
  color:{fill:s.fill,highlight:s.highlight,stroke:s.stroke,stroke_px_pct:s.strokePctOfFont,
    outline_enabled:s.outlineEnabled,shadow:s.shadow,box:s.box,box_color:s.boxColor,
    emphasis_colors:{low:s.emphLow,med:s.emphMed,high:s.emphHigh}},
  highlight:{technique:s.technique,scale:s.scale,karaoke:s.karaoke},
  layout:{position:s.position,align:s.align,safe_margin_v_pct:s.safeMarginVPct,
    margin_h_pct:s.marginHPct,x_pct:(s.xPct==null?null:s.xPct),y_pct:(s.yPct==null?null:s.yPct)}};}
function emphHex(s,e){switch(e){case 'high':return s.emphHigh;case 'med':return s.emphMed;
  case 'low':return s.emphLow;default:return s.fill;}}
function casedText(s,tx){switch(s.textCase){
  case 'upper':return tx.toUpperCase();
  case 'title':return tx.replace(/\S+/g,w=>w[0].toUpperCase()+w.slice(1));
  default:return tx;}}

/* ═════════════════════════ keep-range math (VideoEditorPlayer mirror) ═════════════════════════ */
function computeKeeps(t){
  const total=t?t.sourceDurationS:0; if(!(total>0))return{merged:[],keeps:[],outDur:0};
  const sorted=[...t.cuts].sort((a,b)=>a.startS-b.startS);
  const merged=[];
  for(const c of sorted){
    const last=merged[merged.length-1];
    if(last&&c.startS<=last[1]+0.02){last[1]=Math.max(last[1],c.endS);}
    else merged.push([c.startS,c.endS]);}
  const keeps=[]; let prev=0;
  for(const [s,e] of merged){ if(s>prev+0.01)keeps.push([prev,s]); prev=Math.max(prev,e);}
  if(prev<total-0.01)keeps.push([prev,total]);
  const outDur=keeps.reduce((a,[s,e])=>a+(e-s),0);
  return{merged,keeps,outDur};}
function srcToOut(t){let consumed=0;
  for(const [s,e] of S.keeps){ if(t<s)return consumed; if(t<=e)return consumed+(t-s); consumed+=e-s;}
  return consumed;}
function outToSrc(o){let consumed=0;
  for(const [s,e] of S.keeps){const span=e-s; if(o<=consumed+span)return s+(o-consumed); consumed+=span;}
  return S.keeps.length?S.keeps[S.keeps.length-1][1]:o;}

/* ═════════════════════════ inbound handlers ═════════════════════════ */
const HANDLERS={
  video_timeline_state(m){
    const parsed=parseTimeline(m);
    if(!parsed)return;
    S.t=parsed;
    const km=computeKeeps(parsed); S.merged=km.merged; S.keeps=km.keeps; S.outDur=km.outDur;
    if(S.selCut&&!parsed.cuts.some(c=>c.id===S.selCut))S.selCut=null;
    if(S.selCap&&!(parsed.captions||[]).some(c=>c.id===S.selCap))S.selCap=null;
    // any timeline arrival while rendering = render done (Swift notifyTimelineRefreshed)
    if(S.isRendering)S.isRendering=false;
    loadVideoIfNeeded();
    renderAll();
  },
  video_render_complete(m){
    S.isRendering=false;
    S.toast={kind:'ok',outputPath:m.output_path||'',outputDurationS:num(m.output_duration_s),
      fileSizeBytes:num(m.file_size_bytes),wallSeconds:num(m.wall_seconds)};
    renderToast(); renderChrome(); renderHeader();
    clearTimeout(S.toastTimer);
    S.toastTimer=setTimeout(()=>{S.toast=null;renderToast();},6000);   // success auto-dismisses
  },
  video_render_failed(m){
    S.isRendering=false;
    S.toast={kind:'err',error:String(m.error||'unknown error')};       // failures stick — X only
    clearTimeout(S.toastTimer);
    renderToast(); renderChrome(); renderHeader();
  },
};

/* ═════════════════════════ video / playback (replaces AVComposition) ═════════════════════════ */
const vid=$('vid');
function fileUrl(p){ if(!p)return ''; let u=encodeURI('file://'+(p.startsWith('/')?'':'/')+p);
  return u.replace(/#/g,'%23').replace(/\?/g,'%3F');}
function loadVideoIfNeeded(){
  const p=S.t?S.t.sourcePath:'';
  if(p===S.lastSourcePath)return;
  S.lastSourcePath=p;
  if(!p){vid.removeAttribute('src');vid.load();return;}
  $('buildVeil').style.display='flex';
  vid.src=fileUrl(p);
  vid.load();
}
vid.addEventListener('loadedmetadata',()=>{
  $('buildVeil').style.display='none';
  if(vid.videoWidth>0&&vid.videoHeight>0)
    $('previewBox').style.aspectRatio=(vid.videoWidth/vid.videoHeight).toString();
});
vid.addEventListener('error',()=>{$('buildVeil').style.display='none';});

/* skip removed cut ranges during playback — the AVComposition replacement */
function skipCuts(){
  if(!S.t)return;
  const t=vid.currentTime;
  for(const [s,e] of S.merged){
    if(t>=s&&t<e-0.03){ vid.currentTime=e+0.001; return; }}
  // past the last keep → pause at output end
  if(S.keeps.length){
    const lastEnd=S.keeps[S.keeps.length-1][1];
    if(t>=lastEnd-0.02&&!vid.paused){vid.pause();}}
}
vid.addEventListener('timeupdate',skipCuts);
vid.addEventListener('seeked',skipCuts);
vid.addEventListener('play',()=>renderPlayBtn());
vid.addEventListener('pause',()=>renderPlayBtn());

function seekToSource(s){ // snap forward out of a cut, mirrors VideoEditorPlayer.seekToSource
  let t=outToSrc(srcToOut(s));
  for(const [cs,ce] of S.merged){ if(t>=cs&&t<ce){t=ce+0.001;break;} }
  vid.currentTime=t;}
function togglePlay(){ if(!S.t)return; if(vid.paused)vid.play(); else vid.pause();}

$('playBtn').addEventListener('click',togglePlay);
$('scrub').addEventListener('input',()=>{ vid.currentTime=outToSrc(parseFloat($('scrub').value)); });
function renderPlayBtn(){$('playBtn').innerHTML=ic(vid.paused?'play':'pause',14);}

/* ═════════════════════════ rAF loop — playhead / transport / captions / word ═════════════════════════ */
let lastWordIdx=-1,lastCapKey='';
function tick(){
  requestAnimationFrame(tick);
  if(!S.t||S.mode!=='edit'||S.nav!=='editor')return;
  skipCuts();
  const src=vid.currentTime, out=srcToOut(src);
  // playhead (source-fraction across the ribbon)
  const dur=S.t.sourceDurationS;
  $('playhead').style.left=(dur>0?Math.min(100,Math.max(0,src/dur*100)):0)+'%';
  $('playhead').style.opacity=(dur>0)?0.95:0;
  // transport
  const sc=$('scrub');
  if(document.activeElement!==sc)sc.value=String(out);
  $('timeRO').textContent=`${fmtTime(out)} / ${fmtTime(S.outDur)}`;
  // transcript current word
  if(S.drawerOpen&&S.drawerTab==='transcript')updateCurrentWord(src);
  // caption overlay
  renderOverlay(out);
}
function updateCurrentWord(src){
  const words=S.t.transcriptWords; if(!words.length)return;
  let lo=0,hi=words.length-1,idx=-1;
  while(lo<=hi){const mid=(lo+hi)>>1;
    if(words[mid].startS<=src){idx=mid;lo=mid+1;}else hi=mid-1;}
  if(idx>=0&&!(src>=words[idx].startS&&src<=words[idx].endS))idx=-1;
  if(idx===lastWordIdx)return;
  if(lastWordIdx>=0){const el=document.querySelector(`.wchip[data-i="${lastWordIdx}"]`);
    if(el)el.classList.remove('cur');}
  if(idx>=0){const el=document.querySelector(`.wchip[data-i="${idx}"]`);
    if(el)el.classList.add('cur');}
  lastWordIdx=idx;
}

/* ═════════════════════════ caption overlay (CaptionOverlayView port) ═════════════════════════ */
function activeCaption(out){
  const caps=(S.t&&S.t.captions)||[];
  return caps.find(c=>out>=c.startS-0.02&&out<c.endS+0.02)
      || caps.find(c=>c.id===S.selCap) || null;
}
function defXPct(s){switch(s.align){case 'left':return s.marginHPct+0.20;
  case 'right':return 1-s.marginHPct-0.20;default:return 0.5;}}
function defYPct(s){switch(s.position){case 'center':return 0.5;
  case 'upper_third':return s.safeMarginVPct;default:return 1-s.safeMarginVPct;}}
function weightNum(w){return w==='black'?900:(w==='bold'?700:400);}

function renderOverlay(out){
  const ovl=$('ovl');
  const cap=S.t?activeCaption(out):null;
  if(!cap){ if(lastCapKey!==''){ovl.innerHTML='';lastCapKey='';} return; }
  const st=cap.style||defaultStyle();
  const words=cap.words.length?cap.words:
    [{id:0,text:cap.text,startS:cap.startS,endS:cap.endS,emphasis:'none'}];
  let aw=-1;
  if(st.karaoke)aw=words.findIndex(w=>out>=w.startS&&out<w.endS);
  const drag=S.capDrag&&S.capDrag.capId===cap.id?S.capDrag:null;
  const key=[cap.id,aw,S.selCap===cap.id,drag?`${drag.x},${drag.y},${drag.size}`:'',ovl.clientHeight].join('|');
  if(key===lastCapKey)return;
  lastCapKey=key;

  const H=ovl.clientHeight||1,W=ovl.clientWidth||1;
  const xPct=(drag&&drag.x!=null)?drag.x:(st.xPct!=null?st.xPct:defXPct(st));
  const yPct=(drag&&drag.y!=null)?drag.y:(st.yPct!=null?st.yPct:defYPct(st));
  const sizePct=(drag&&drag.size!=null)?drag.size:st.sizePct;
  const fs=Math.max(8,sizePct*H);
  const isSel=S.selCap===cap.id;
  const maxW=W*(1-2*st.marginHPct);
  const strokeR=st.outlineEnabled?Math.max(0.5,st.strokePctOfFont*fs*0.6):0;
  let shadows=[];
  if(strokeR>0){const r=strokeR.toFixed(1),c=st.stroke;
    shadows.push(`-${r}px 0 0 ${c}`,`${r}px 0 0 ${c}`,`0 -${r}px 0 ${c}`,`0 ${r}px 0 ${c}`,
      `-${r}px -${r}px 0 ${c}`,`${r}px -${r}px 0 ${c}`,`-${r}px ${r}px 0 ${c}`,`${r}px ${r}px 0 ${c}`);}
  if(st.shadow)shadows.push('0 1px 2px rgba(0,0,0,.85)');
  const shadowCss=shadows.length?`text-shadow:${shadows.join(',')};`:'';
  const spans=words.map((w,i)=>{
    const active=i===aw;
    const hex=active?st.highlight:emphHex(st,w.emphasis);
    const scale=(active&&st.technique==='scale_pop')?`display:inline-block;transform:scale(${st.scale});`:'';
    const boxHi=(active&&st.technique==='box')?`background:${st.highlight};color:#000;border-radius:${(fs*0.12).toFixed(1)}px;`:'';
    return `<span style="color:${hex};${scale}${boxHi}">${esc(casedText(st,w.text))}</span>`;
  }).join(' ');
  const boxCss=st.box?`background:${st.boxColor}eb;border-radius:4px;
    padding:${(fs*0.12).toFixed(1)}px ${(fs*0.3).toFixed(1)}px;`:'';
  const alignCss=st.align==='left'?'left':(st.align==='right'?'right':'center');
  ovl.innerHTML=`<div class="capBlock${isSel?' sel':''}" id="capBlockEl" data-cap="${esc(cap.id)}"
    style="left:${(xPct*100).toFixed(2)}%;top:${(yPct*100).toFixed(2)}%;max-width:${maxW.toFixed(0)}px;
      font-family:'${esc(st.font)}','Arial Black','Helvetica Neue',sans-serif;
      font-weight:${weightNum(st.weight)};font-size:${fs.toFixed(1)}px;text-align:${alignCss};${shadowCss}">
    <span style="${boxCss}display:inline-block;">${spans}</span>
    ${isSel?'<div class="capHandle" id="capHandleEl"></div>':''}</div>`;
  bindOverlay(cap,st);
}
function bindOverlay(cap,st){
  const blk=$('capBlockEl'); if(!blk)return;
  blk.addEventListener('mousedown',e=>{
    if(e.target.id==='capHandleEl')return;
    e.preventDefault();
    S.selCap=cap.id; S.capDrag={mode:'move',capId:cap.id,x:null,y:null,size:null};
    const ovl=$('ovl'),r=ovl.getBoundingClientRect();
    const move=ev=>{
      S.capDrag.x=Math.min(0.98,Math.max(0.02,(ev.clientX-r.left)/r.width));
      S.capDrag.y=Math.min(0.96,Math.max(0.04,(ev.clientY-r.top)/r.height));};
    const up=()=>{window.removeEventListener('mousemove',move);window.removeEventListener('mouseup',up);
      if(S.capDrag&&S.capDrag.x!=null)
        sendMsg({type:'video_caption_update',caption_id:cap.id,
          style_patch:{layout:{x_pct:S.capDrag.x,y_pct:S.capDrag.y}}});
      S.capDrag=null; renderInspector();};
    window.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
    renderInspector();
  });
  blk.addEventListener('click',e=>{ if(e.target.id!=='capHandleEl'){S.selCap=cap.id;renderInspector();} });
  const h=$('capHandleEl');
  if(h)h.addEventListener('mousedown',e=>{
    e.preventDefault();e.stopPropagation();
    const ovl=$('ovl'),r=ovl.getBoundingClientRect(),startY=e.clientY,base=st.sizePct;
    S.capDrag={mode:'size',capId:cap.id,x:null,y:null,size:base};
    const move=ev=>{const d=(ev.clientY-startY)/r.height;
      S.capDrag.size=Math.min(0.16,Math.max(0.020,base+d));};
    const up=()=>{window.removeEventListener('mousemove',move);window.removeEventListener('mouseup',up);
      if(S.capDrag&&S.capDrag.size!=null)
        sendMsg({type:'video_caption_update',caption_id:cap.id,
          style_patch:{typography:{size_pct:S.capDrag.size}}});
      S.capDrag=null;};
    window.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
  });
}

/* deterministic pseudo-waveform (WaveformShape port) */
function drawWave(){
  const cv=$('waveCanvas'); if(!cv||!S.t)return;
  const w=cv.clientWidth,h=cv.clientHeight; if(!w||!h)return;
  const dpr=window.devicePixelRatio||1;
  cv.width=w*dpr;cv.height=h*dpr;
  const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,w,h);
  const N=240,total=Math.max(S.t.sourceDurationS,0.001),mid=h/2;
  const cuts=S.t.cuts.map(c=>[c.startS,c.endS]);
  const amp=t=>{let a=12+9*Math.sin(t*18+1)+5*Math.sin(t*47)+3*Math.sin(t*91+0.5);
    const ts=t*total;
    for(const [s,e] of cuts){if(ts>=s&&ts<=e){a*=0.25;break;}}
    return a;};
  g.beginPath();g.moveTo(0,mid);
  for(let i=0;i<N;i++){const t=i/N,x=t*w;
    const y=mid-Math.abs(amp(t))*0.9*(0.8+0.4*Math.sin(i*0.3));
    g.lineTo(x,y);}
  for(let i=N-1;i>=0;i--){const t=i/N,x=t*w;
    const y=mid+Math.abs(amp(t))*0.9*(0.8+0.4*Math.cos(i*0.27));
    g.lineTo(x,y);}
  g.closePath();g.fillStyle='rgba(255,255,255,.15)';g.fill();
}
new ResizeObserver(()=>{drawWave();lastCapKey='';}).observe(document.body);

function renderRuler(){
  if(!S.t){$('timeRuler').innerHTML='';return;}
  const dur=S.t.sourceDurationS;
  if(!(dur>0)){$('timeRuler').innerHTML='';return;}
  let step;
  if(dur<30)step=5; else if(dur<120)step=20; else if(dur<600)step=60;
  else if(dur<3600)step=300; else step=600;
  const marks=[0];for(let t=step;t<dur;t+=step)marks.push(t);marks.push(dur);
  $('timeRuler').innerHTML=marks.map(t=>
    `<span style="left:${pct(t,dur)}%">${fmtShort(t)}</span>`).join('');
}

let lufsRAF=null;
function scopesTabHtml(){
  return secHead('Audio · target -14 LUFS (YouTube)')+
    `<div class="scopecard"><div class="st">Loudness · -14.2 integrated</div>
      <canvas id="lufsCanvas"></canvas></div>`+
    `<div class="scopecard"><div class="st">Spectrogram · 20Hz – 20kHz</div>
      <div class="spectro">
        <i style="width:28px;height:28px;background:rgba(91,224,166,.4);left:12%;top:14px;"></i>
        <i style="width:22px;height:22px;background:rgba(192,139,255,.4);left:52%;top:6px;"></i>
        <i style="width:24px;height:24px;background:rgba(91,224,166,.45);left:78%;top:12px;"></i>
      </div></div>`+
    secHead('Color (placeholder · Color mode)')+
    `<div class="wheelrow">
      <div class="wheel"><div class="disc"></div><span class="wl">Lift</span></div>
      <div class="wheel"><div class="disc"></div><span class="wl">Gamma</span></div>
      <div class="wheel"><div class="disc"></div><span class="wl">Gain</span></div></div>
    <div class="scopeNote">Switch to Color mode tab (top) for the full grading workspace — coming in V5.x.</div>`;
}
function startLufs(){
  const cv=$('lufsCanvas'); if(!cv)return;
  let last=0;
  const draw=(ts)=>{
    lufsRAF=requestAnimationFrame(draw);
    if(ts-last<100)return; last=ts;
    const w=cv.clientWidth,h=cv.clientHeight; if(!w)return;
    const dpr=window.devicePixelRatio||1;
    if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr;}
    const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
    const n=24,bw=(w-(n-1)*2)/n,time=ts/1000;
    for(let i=0;i<n;i++){
      const phase=Math.sin(time*2+i*0.6),off=Math.sin(time*0.7+i*1.3)*0.3;
      const lvl=Math.max(0.15,Math.min(1,0.5+phase*0.35+off));
      const bh=h*lvl,x=i*(bw+2);
      const grad=g.createLinearGradient(0,h,0,0);
      grad.addColorStop(0,'#5BE0A6');grad.addColorStop(0.55,'#FFB347');grad.addColorStop(1,'#ff6b6b');
      g.globalAlpha=0.7;g.fillStyle=grad;
      g.beginPath();g.roundRect(x,h-bh,bw,bh,1);g.fill();}
    g.globalAlpha=1;};
  lufsRAF=requestAnimationFrame(draw);
}
function stopLufs(){if(lufsRAF){cancelAnimationFrame(lufsRAF);lufsRAF=null;}}

/* ── Captions tab (fully functional editor) ── */
const CAPTION_FONTS=['Montserrat','Anton','Bebas Neue','Oswald','Inter','Poppins','Archivo','Helvetica Neue','Arial'];
function prettyPreset(p){return p.replace(/_/g,' ').replace(/\S+/g,w=>w[0].toUpperCase()+w.slice(1));}
function selectedCaption(){return S.t&&S.t.captions?S.t.captions.find(c=>c.id===S.selCap)||null:null;}
function currentCapStyle(){
  const sel=selectedCaption();
  if(sel)return sel.style;
  if(S.t&&S.t.captionTrack)return S.t.captionTrack.defaultStyle;
  return defaultStyle();}
function selOpts(opts,cur,labelFn){return opts.map(o=>
  `<option value="${esc(o)}"${o===cur?' selected':''}>${esc(labelFn?labelFn(o):o)}</option>`).join('');}

function captionsTabHtml(){

    <span style="flex:none;font-size:11px;color:var(--w60)">Style</span>

      <div><div class="fieldlab">Font</div>

          CAPTION_FONTS.includes(st.font)?CAPTION_FONTS:[st.font,...CAPTION_FONTS],st.font)}</select></div>
      <div><div class="fieldlab">Weight</div>
        <select class="capsel" id="capWeight">${selOpts(['normal','bold','black'],st.weight,
          w=>w[0].toUpperCase()+w.slice(1))}</select></div></div>`;
    h+=`<div class="capsec"><div class="sliderhead"><span class="fieldlab" style="margin:0">Size</span>
        <span class="pct">${Math.round(st.sizePct*100)}%</span></div>
      <input type="range" class="caprange" id="capSize" min="0.02" max="0.16" step="0.001" value="${st.sizePct}"/></div>`;
    h+=`<div class="caprow">
      <div><div class="fieldlab">Case</div>
        <select class="capsel" id="capCase">${selOpts(['upper','title','sentence','as_is'],st.textCase)}</select></div>
      <div><div class="fieldlab">Align</div>
        <select class="capsel" id="capAlign">${selOpts(['left','center','right'],st.align)}</select></div></div>`;
    h+=`<div class="colorwellrow">
      <div class="cwell"><span class="fieldlab" style="margin:0">Text</span>
        <input type="color" id="cwFill" value="${esc(st.fill)}"/></div>
      <div class="cwell"><span class="fieldlab" style="margin:0">Active</span>
        <input type="color" id="cwHi" value="${esc(st.highlight)}"/></div>
      <div class="cwell"><span class="fieldlab" style="margin:0">Border</span>

    h+=`<div class="togrow"><label class="ckbox"><input type="checkbox" id="capOutline"${st.outlineEnabled?' checked':''}/>Text border</label></div>`;

      h+=`<div class="capsec"><div class="sliderhead"><span class="fieldlab" style="margin:0">Border width</span>

function capPatch(patch){
  if(!S.selCap)return;
  // optimistic local apply for instant preview; Python re-broadcasts authoritative state
  const cap=selectedCaption();
  if(cap)applyLocalPatch(cap.style,patch);
  lastCapKey='';
  sendMsg({type:'video_caption_update',caption_id:S.selCap,style_patch:patch});
}
function applyLocalPatch(s,patch){
  const t=patch.typography||{};
  if('font' in t)s.font=t.font; if('weight' in t)s.weight=t.weight;
  if('size_pct' in t)s.sizePct=t.size_pct; if('case' in t)s.textCase=t.case;
  const c=patch.color||{};
  if('fill' in c)s.fill=c.fill; if('highlight' in c)s.highlight=c.highlight;
  if('stroke' in c)s.stroke=c.stroke; if('stroke_px_pct' in c)s.strokePctOfFont=c.stroke_px_pct;
  if('outline_enabled' in c)s.outlineEnabled=c.outline_enabled;
  if('shadow' in c)s.shadow=c.shadow; if('box' in c)s.box=c.box; if('box_color' in c)s.boxColor=c.box_color;
  const h=patch.highlight||{};
  if('technique' in h)s.technique=h.technique; if('karaoke' in h)s.karaoke=h.karaoke;
  const l=patch.layout||{};
  if('position' in l)s.position=l.position; if('align' in l)s.align=l.align;
  if('x_pct' in l)s.xPct=l.x_pct; if('y_pct' in l)s.yPct=l.y_pct;
}
function bindCaptionsTab(){
  const b=$('inspBody');
  const on=(id,ev,fn)=>{const el=b.querySelector('#'+id);if(el)el.addEventListener(ev,fn);};
  b.querySelectorAll('[data-cact]').forEach(el=>el.addEventListener('click',()=>{
    switch(el.dataset.cact){
      case 'auto':sendMsg({type:'video_caption_autocaption',smart:false});break;
      case 'smart':sendMsg({type:'video_caption_autocaption',smart:true});break;
      case 'regen':sendMsg({type:'video_caption_autocaption',smart:false});break;
      case 'export':sendMsg({type:'video_caption_export'});break;
      case 'applyall':sendMsg({type:'video_caption_apply_style_to_all',style:styleAsDict(currentCapStyle())});break;
      case 'del':if(S.selCap){sendMsg({type:'video_caption_delete',caption_id:S.selCap});
        S.selCap=null;renderInspector();renderTimeline();}break;
      case 'resetpos':capPatch({layout:{x_pct:null,y_pct:null}});renderInspector();break;
      case 'add':{const out=srcToOut(vid.currentTime||0);
        sendMsg({type:'video_caption_add',start_s:out,end_s:out+2,text:'New caption'});break;}
    }}));
  on('capPreset','change',()=>{const p=b.querySelector('#capPreset').value;if(!p)return;
    if(S.selCap)sendMsg({type:'video_caption_update',caption_id:S.selCap,style_patch:{__preset__:p}});
    else sendMsg({type:'video_caption_apply_style_to_all',preset:p});});
  const commitText=()=>{const el=b.querySelector('#capText');
    if(el&&S.selCap&&el.value!==selectedCaption()?.text)
      sendMsg({type:'video_caption_update',caption_id:S.selCap,text:el.value});};
  on('capText','keydown',e=>{if(e.key==='Enter'){commitText();e.target.blur();}});
  on('capText','blur',commitText);
  on('capFont','change',e=>capPatch({typography:{font:e.target.value}}));
  on('capWeight','change',e=>capPatch({typography:{weight:e.target.value}}));
  on('capSize','change',e=>capPatch({typography:{size_pct:parseFloat(e.target.value)}}));
  on('capSize','input',e=>{const cap=selectedCaption();
    if(cap){cap.style.sizePct=parseFloat(e.target.value);lastCapKey='';}});
  on('capCase','change',e=>capPatch({typography:{'case':e.target.value}}));
  on('capAlign','change',e=>capPatch({layout:{align:e.target.value}}));
  on('cwFill','change',e=>capPatch({color:{fill:e.target.value.toUpperCase()}}));
  on('cwHi','change',e=>capPatch({color:{highlight:e.target.value.toUpperCase()}}));
  on('cwStroke','change',e=>capPatch({color:{stroke:e.target.value.toUpperCase()}}));
  on('capOutline','change',e=>{capPatch({color:{outline_enabled:e.target.checked}});renderInspector();});
  on('capStrokeW','change',e=>capPatch({color:{stroke_px_pct:parseFloat(e.target.value)}}));
  on('capBox','change',e=>{capPatch({color:{box:e.target.checked}});renderInspector();});
  on('cwBox','change',e=>capPatch({color:{box_color:e.target.value.toUpperCase()}}));
  on('capShadow','change',e=>capPatch({color:{shadow:e.target.checked}}));
  on('capTech','change',e=>capPatch({highlight:{technique:e.target.value}}));
  on('capKaraoke','change',e=>capPatch({highlight:{karaoke:e.target.checked}}));
  on('capPos','change',e=>capPatch({layout:{position:e.target.value}}));
}

/* ═════════════════════════ render toast ═════════════════════════ */
function renderToast(){
  const w=$('toastWrap');
  if(!S.toast){w.classList.add('hide');return;}
  if(S.toast.kind==='ok'){
    const fn=(S.toast.outputPath||'').split(/[\\/]/).pop();
    const mb=S.toast.fileSizeBytes/(1024*1024);
    w.innerHTML=`<div class="toast ok">
      <span class="tico" style="color:var(--green)">${ic('check',18)}</span>
      <div class="tt"><div class="r1"><span>Render complete</span><span class="mid">·</span>
        <span class="fn">${esc(fn)}</span></div>
        <div class="r2">${S.toast.outputDurationS.toFixed(2)}s output&nbsp;&nbsp;·&nbsp;&nbsp;${mb.toFixed(1)} MB&nbsp;&nbsp;·&nbsp;&nbsp;rendered in ${S.toast.wallSeconds.toFixed(1)}s</div></div>
      <button class="finderBtn" id="finderBtn">${ic('folder',10)}Show in Finder</button>
      <button class="toastX" id="toastX">${ic('x',9,2.6)}</button></div>`;
    $('finderBtn').addEventListener('click',()=>
      sendMsg({type:'ui_action',action:'reveal_path',value:S.toast.outputPath}));
  }else{
    w.innerHTML=`<div class="toast err">
      <span class="tico" style="color:var(--dred)">${ic('warn',18)}</span>
      <div class="tt"><div class="r1"><span>Render failed</span></div>
        <div class="r2">${esc(S.toast.error)}</div></div>
      <button class="toastX" id="toastX">${ic('x',9,2.6)}</button></div>`;
  }
  $('toastX').addEventListener('click',()=>{clearTimeout(S.toastTimer);S.toast=null;renderToast();});
  w.classList.remove('hide');
}

/* ═════════════════════════ keyboard ═════════════════════════ */
window.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){
    e.preventDefault();sendMsg({type:'video_undo'});return;}
  if(typing)return;
  if(e.code==='Space'){e.preventDefault();togglePlay();return;}
  if(e.key==='ArrowLeft'){e.preventDefault();
    vid.currentTime=outToSrc(Math.max(0,srcToOut(vid.currentTime)-5));return;}
  if(e.key==='ArrowRight'){e.preventDefault();
    vid.currentTime=outToSrc(Math.min(S.outDur,srcToOut(vid.currentTime)+5));return;}
});

/* ═════════════════════════ top-level render ═════════════════════════ */
function renderAll(){
  renderChrome();renderNav();renderWorkspace();renderToast();
  if(S.t&&S.mode==='edit'&&S.nav==='editor'){
    renderHeader();renderStats();renderTlHeader();renderTimeline();
    renderCutList();renderDrawer();renderFooter();renderInspector();
    const sc=$('scrub');sc.max=String(Math.max(S.outDur,0.01));
    renderPlayBtn();
  }else{stopLufs();}
}

/* boot */
renderAll();
renderPlayBtn();
requestAnimationFrame(tick);
